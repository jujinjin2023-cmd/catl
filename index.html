<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的工作简报</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f1f5f9;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            padding: 2rem 1rem;
            color: #0f172a;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .page-header {
            padding: 2rem 2rem 0.5rem 2rem;
            border-bottom: 1px solid #e9eef3;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e293b, #2d3a4f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        h1::before { content: "📋"; font-size: 1.8rem; background: none; color: #2c6e9e; }
        .sub {
            color: #5b6e8c;
            font-size: 0.9rem;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
            margin-top: 12px;
        }
        .ad-card {
            margin: 1.5rem 2rem;
            background: #f8fafc;
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            text-align: center;
            font-size: 0.85rem;
            color: #6c7a91;
        }
        .reports-list {
            padding: 0 2rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        /* 可折叠卡片样式 */
        .report-card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #eef2f6;
            transition: all 0.2s;
            overflow: hidden;
        }
        .report-header {
            padding: 1rem 1.5rem;
            cursor: pointer;
            user-select: none;
            background: #fdfdfd;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .report-header:hover {
            background: #f8fafc;
        }
        .report-title-area {
            flex: 1;
        }
        .report-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0c4e6e;
            letter-spacing: -0.2px;
        }
        .report-date {
            display: inline-block;
            font-size: 0.75rem;
            color: #6c86a3;
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 6px;
        }
        .toggle-icon {
            font-size: 1.2rem;
            color: #6c86a3;
            transition: transform 0.2s;
        }
        .report-content {
            padding: 0 1.5rem 0 1.5rem;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            background: #ffffff;
            border-top: 0px solid #eef2f6;
        }
        .report-card.open .report-content {
            max-height: 3000px; /* 足够大容纳内容 */
            padding: 1.5rem 1.5rem 1.8rem 1.5rem;
            border-top-width: 1px;
        }
        .report-card.open .toggle-icon {
            transform: rotate(180deg);
        }
        /* markdown 内容样式 */
        .report-content h2 {
            font-size: 1.25rem;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
            margin: 1em 0 0.5em;
        }
        .report-content p {
            margin: 0.6em 0;
            line-height: 1.6;
        }
        .report-content ul, .report-content ol {
            margin: 0.6em 0 0.6em 1.5em;
        }
        .report-content img {
            max-width: 100%;
            border-radius: 16px;
            margin: 1rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .loading-state, .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c86a3;
        }
        .dot-pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8);}
            50% { opacity: 1; transform: scale(1.2);}
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 1.5rem;
            color: #94a3b8;
            border-top: 1px solid #eef2f6;
        }
        @media (max-width: 640px) {
            .page-header { padding: 1.2rem 1.2rem 0rem 1.2rem; }
            .reports-list { padding: 0 1rem 1rem 1rem; gap: 0.8rem; }
            .report-header { padding: 0.8rem 1rem; }
            .report-title { font-size: 1.1rem; }
            .report-content { padding: 0 1rem; }
            .report-card.open .report-content { padding: 1rem 1rem 1.2rem 1rem; }
            .ad-card { margin: 1rem 1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>运维周报</h1>
        <div class="sub">记录·沉淀·成长</div>
    </div>
    <div class="ad-card" id="adPlaceholder">
        📢 广告位预留 · 可替换为自定义内容
    </div>
    <div class="reports-list" id="reportsContainer">
        <div class="loading-state"><span class="dot-pulse"></span> 正在加载周报...</div>
    </div>
    <footer>📌 每周更新 · 点击标题展开/折叠</footer>
</div>

<script>
    const GITHUB_USER = 'jujinjin2023-CMD';
    const GITHUB_REPO = 'catl';
    const REPORTS_FOLDER = '_reports';

    const reportsContainer = document.getElementById('reportsContainer');

    function decodeBase64(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
    }

    function rewriteImageUrls(markdown) {
        const regex = /!\[.*?\]\((https?:\/\/raw\.githubusercontent\.com\/[^\)]+?\/images\/[^\)]+)\)/g;
        return markdown.replace(regex, (match, url) => {
            const repoMatch = url.match(/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\//);
            if (repoMatch) {
                const user = repoMatch[1];
                const repo = repoMatch[2];
                const imagePath = url.split('/images/')[1];
                if (imagePath) {
                    const newUrl = `https://cdn.jsdelivr.net/gh/${user}/${repo}@main/images/${imagePath}`;
                    return match.replace(url, newUrl);
                }
            }
            return match;
        });
    }

    async function fetchAndRenderReports() {
        reportsContainer.innerHTML = `<div class="loading-state"><span class="dot-pulse"></span> 正在加载周报...</div>`;
        try {
            const listUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${REPORTS_FOLDER}`;
            const listRes = await fetch(listUrl);
            if (!listRes.ok) {
                if (listRes.status === 404) {
                    reportsContainer.innerHTML = `<div class="empty-state">📭 还没有周报<br>请在仓库中创建 <code>_reports</code> 文件夹并放入 .md 文件</div>`;
                    return;
                }
                throw new Error(`HTTP ${listRes.status}`);
            }
            const files = await listRes.json();
            const mdFiles = files.filter(f => f.name.endsWith('.md'))
                                 .sort((a, b) => b.name.localeCompare(a.name));

            if (mdFiles.length === 0) {
                reportsContainer.innerHTML = `<div class="empty-state">✨ 第一篇周报正在路上<br>快去 <strong>_reports</strong> 文件夹创建 .md 文件吧</div>`;
                return;
            }

            reportsContainer.innerHTML = '';
            for (const file of mdFiles) {
                const contentRes = await fetch(file.url);
                const contentData = await contentRes.json();
                let rawMarkdown = decodeBase64(contentData.content);
                rawMarkdown = rewriteImageUrls(rawMarkdown);

                let title = '周报';
                const titleMatch = rawMarkdown.match(/^#\s+(.+)/m);
                if (titleMatch) title = titleMatch[1];

                let markdownBody = rawMarkdown;
                if (rawMarkdown.trim().startsWith('---')) {
                    const secondDash = rawMarkdown.indexOf('---', 3);
                    if (secondDash !== -1) {
                        markdownBody = rawMarkdown.substring(secondDash + 3).trim();
                    }
                }

                let displayDate = '未知日期';
                const dateMatch = file.name.match(/(\d{4}-\d{2}-\d{2})/);
                if (dateMatch) displayDate = dateMatch[1];

                const htmlContent = marked.parse(markdownBody);

                // 构建可折叠卡片
                const card = document.createElement('article');
                card.className = 'report-card';
                card.innerHTML = `
                    <div class="report-header">
                        <div class="report-title-area">
                            <div class="report-title">${escapeHtml(title)}</div>
                            <div class="report-date">📅 ${escapeHtml(displayDate)}</div>
                        </div>
                        <div class="toggle-icon">▼</div>
                    </div>
                    <div class="report-content">${htmlContent}</div>
                `;
                // 绑定点击事件
                const header = card.querySelector('.report-header');
                header.addEventListener('click', () => {
                    card.classList.toggle('open');
                });
                reportsContainer.appendChild(card);
            }
        } catch (err) {
            console.error(err);
            reportsContainer.innerHTML = `<div class="empty-state">⚠️ 加载失败: ${err.message}<br>请检查仓库是否为公开，且 _reports 文件夹存在</div>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    fetchAndRenderReports();
</script>
</body>
</html>
