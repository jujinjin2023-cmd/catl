backend:
  name: github
  repo: jujinjin2023-CMD/卡特尔  # ️ 请确保与您的实际仓库名完全一致
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "reports"
    label: "工作周报"
    folder: "_reports"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "内容", name: "body", widget: "markdown"}
